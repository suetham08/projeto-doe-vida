```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Doe vida</title>
</head>

<body>

    <header>
        <h1>Faça sua doação:</h1>

        <nav>
            <a href="index.html">Ínicio</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html">Contato e apoio</a>
            <a href="doacao.html">Doação</a>
        </nav>
    </header>

    <main>

        <h2>Valor</h2>

        <form action="agradecimento.html" onsubmit="return validarDoacao()">

            <div id="valorExibido">R$ 0,00</div>

            <input
                type="number"
                id="valorManual"
                placeholder="Digite o valor"
                min="0"
                step="0.01"
                oninput="atualizarValorManual()"
             required>

            <input type="hidden" id="valor" name="valor" value="0.00 required">

            <br><br>

            <button type="button" onclick="adicionarValor(5)">+5</button>
            <button type="button" onclick="adicionarValor(10)">+10</button>
            <button type="button" onclick="adicionarValor(20)">+20</button>
            <button type="button" onclick="adicionarValor(50)">+50</button>
            <button type="button" onclick="adicionarValor(100)">+100</button>

            <br><br>

            <input type="submit" value="Processar pagamento">

        </form>

        <h3>Tipo de pagamento:</h3>

        <form action="agradecimento.html">

            <input 
            type="radio" 
            id="pix" 
            name="opcao" 
            value="Pix" 
            required
            >
            <label for="pix">Pix</label>

            <br>

            <input 
            type="radio" 
            id="cc" 
            name="opcao" 
            value="Cartão Crédito"
            >
            <label for="cc">Cartão de Crédito</label>

            <br>

            <input 
            type="radio" 
            id="cartaodebito" 
            name="opcao" 
            value="Cartão Débito"
            >
            <label for="cartaodebito">Cartão de Débito</label>

        </form>

    </main>

    <footer>
        <p>Organização</p>
    </footer>

</body>
</html>

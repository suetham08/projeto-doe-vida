```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Doe vida</title>
</head>

<body>

    <header>
        <h1>Faça sua doação:</h1>

        <nav>
            <a href="index.html">Ínicio</a>
            <a href="projetos.html">Projetos</a>
            <a href="contato.html">Contato e apoio</a>
            <a href="doacao.html">Doação</a>
        </nav>
    </header>

    <main>

        <h2>Valor</h2>

        <form action="main.html" method="post">

            <div id="valorExibido">R$ 0,00</div>

            <input
                type="number"
                id="valorManual"
                placeholder="Digite o valor"
                min="0"
                step="0.01"
                oninput="atualizarValorManual()"
            >

            <input type="hidden" id="valor" name="valor" value="0.00">

            <br><br>

            <button type="button" onclick="adicionarValor(5)">+5</button>
            <button type="button" onclick="adicionarValor(10)">+10</button>
            <button type="button" onclick="adicionarValor(50)">+50</button>
            <button type="button" onclick="adicionarValor(100)">+100</button>

            <br><br>

            <input type="submit" value="Submit">

        </form>

        <h3>Selecione o método de doação:</h3>

        <form action="main.html" method="post">

            <input type="radio" id="pix" name="opcao" value="Pix">
            <label for="pix">Pix</label>

            <br>

            <input type="radio" id="cc" name="opcao" value="Cartão Crédito">
            <label for="cc">Cartão de Crédito</label>

            <br>

            <input type="radio" id="cartaodebito" name="opcao" value="Cartão Débito">
            <label for="cartaodebito">Cartão de Débito</label>

        </form>

    </main>

    <footer>
        <p>Organização</p>
    </footer>

    <script>
        function atualizarTela(valor) {
            document.getElementById("valor").value = valor.toFixed(2);

            document.getElementById("valorExibido").textContent =
                "R$ " + valor.toFixed(2).replace(".", ",");
        }

        function atualizarValorManual() {
            const campo = document.getElementById("valorManual");

            const valor = parseFloat(campo.value || 0);

            atualizarTela(valor);
        }

        function adicionarValor(valor) {
            const campo = document.getElementById("valorManual");

            const valorAtual = parseFloat(campo.value || 0);

            const novoValor = valorAtual + valor;

            campo.value = novoValor.toFixed(2);

            atualizarTela(novoValor);
        }
    </script>

</body>
</html>
```

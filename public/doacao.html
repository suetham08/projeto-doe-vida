<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>

<title>Doe vida</title>

</head> <body>
<header>
    <h1>Faça sua doação:</h1>

    <nav>
        <a href="index.html">Ínicio</a>
        <a href="projetos.html">Projetos</a>
        <a href="contato.html">Contato e apoio</a>
        <a href="doacao.html">Doação</a>
    </nav>
</header>

<main>

    <section class="form-container">

        <h2>Código:</h2>

            <form id="paymentForm"
                  action="/pagto"
                  method="POST">

            <div class="form-group">

                <label for="codigo">
                    Código:
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    required
                >

                <small>
                    Digite exatamente 6 números.
                </small>

            </div>

            <div class="form-group">

                <h3>Valor</h3>

                <div id="valorExibido">
                    R$ 0,00
                </div>

                <input
                    type="number"
                    id="valorManual"
                    placeholder="Digite o valor"
                    min="0"
                    step="0.01"
                    oninput="atualizarValorManual()"
                    required
                >

                <input
                    type="hidden"
                    id="valor"
                    name="valor"
                    value="0.00"
                >

                <br><br>

                <button
                    type="button"
                    onclick="adicionarValor(5)"
                >
                    +5
                </button>

                <button
                    type="button"
                    onclick="adicionarValor(10)"
                >
                    +10
                </button>

                <button
                    type="button"
                    onclick="adicionarValor(20)"
                >
                    +20
                </button>

                <button
                    type="button"
                    onclick="adicionarValor(50)"
                >
                    +50
                </button>

                <button
                    type="button"
                    onclick="adicionarValor(100)"
                >
                    +100
                </button>

            </div>


            <div class="form-group">

                <h4>Tipo de pagamento:</h4>

                <input
                    type="radio"
                    id="pix"
                    name="tipo"
                    value="0"
                    required
                >

                <label for="pix">
                    Pix
                </label>

                <br>

                <input
                    type="radio"
                    id="cc"
                    name="tipo"
                    value="1"
                >

                <label for="cc">
                    Cartão de Crédito
                </label>

                <br>

                <input
                    type="radio"
                    id="cartaodebito"
                    name="tipo"
                    value="2"
                >

                <label for="cartaodebito">
                    Cartão de Débito
                </label>

            </div>


            <br>

            <input
                type="submit"
                value="Processar pagamento"
            >

        </form>

    </section>

</main>

<footer>
    <p>Organização</p>
</footer>

</body> </html>
